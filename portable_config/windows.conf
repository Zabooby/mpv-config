### Windows Direct3D 11 Configuration ###

# General Video Driver & Hardware Acceleration
gpu-api=d3d11
hwdec=d3d11va-copy
d3d11va-zero-copy=yes
d3d11-exclusive-fs=yes
d3d11-adapter=

# Profile for Direct3D 11 10-bit HDR Output Override
[HDR-Windows]
profile-cond=p["video-params/primaries"] == "bt.2020" and p["video-params/gamma"] == "pq" and display_width == 2560 and display_height == 1440
d3d11-output-csp=pq
d3d11-output-format=rgb10_a2